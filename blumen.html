<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FuneralPlaner – Blumen</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#eee8df;color:#3b3027}
.top{background:#5b4939;color:white;padding:16px 18px;font-size:24px}
.wrap{max-width:900px;margin:auto;padding:20px}
.back{display:inline-block;padding:12px 16px;background:#fff;border:1px solid #b9aa9a;border-radius:10px;text-decoration:none;color:#3b3027;margin-bottom:20px}
.card{background:#fffdf9;border:1px solid #ddd2c5;border-radius:14px;padding:16px;margin:14px 0;display:flex;gap:16px;align-items:center}
.card img{width:110px;height:90px;object-fit:cover;border-radius:10px}
h1{font-size:28px}h2{margin:0 0 6px}
@media(max-width:600px){.card{align-items:flex-start}.card img{width:90px;height:75px}}
</style></head><body>
<div class="top">FuneralPlaner – Blumen</div><main class="wrap">
<a class="back" href="index.html">← Zur Übersicht</a>
<h1>Blumen</h1><div id="list"></div></main>
<script>
const KEY='fp_exact_layout_catalog_v1';
let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const items=data.filter(x=>x.category==='Blumen');
const list=document.getElementById('list');
list.innerHTML=items.length?items.map(x=>`<div class="card"><img src="${x.image||'blumen.jpg'}"><div><h2>${String(x.name||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</h2><div>${x.price||'Auf Anfrage'}</div></div></div>`).join(''):'<p>In dieser Kategorie sind aktuell keine Artikel hinterlegt.</p>';
</script></body></html>
